[project]
name = "olive"
version = "0.2.0"
description = "Self-Hosted AI Meeting Intelligence, Speaker Diarization & Audio Archive"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "sse-starlette>=2.2.0",
  "apscheduler>=3.11.0,<4.0.0",
  "tenacity>=9.0.0",
  "httpx>=0.28.0",
  "authlib>=1.4.0",
  "typer>=0.15.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "scikit-learn>=1.6.0",
  "soundfile>=0.13.0",
  "any-llm-sdk>=1.30.0",
  "google-genai>=1.70.0",
  "speechmatics-batch>=1.1.0",
  "mcp>=1.6.0",
  "torch>=2.8.0",
  "torchaudio>=2.8.0",
  "transformers>=5.4.0",
  "onnxruntime>=1.20.0",
  "huggingface-hub>=0.28.1",
  "pyannote-audio>=4.0.0",
  "ctc-forced-aligner>=1.0.2",
  "unidecode>=1.3.8",
  "jiwer>=3.1.0",
  "dbos>=3.2.0",
  "aiosqlite>=0.22.1",
  "assemblyai>=1.6.1",
  "fpdf2>=2.8",
]

[project.scripts]
olive = "olive.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "respx>=0.22.0",
  "ruff>=0.9.0",
  "basedpyright>=1.28.0",
  "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olive"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
addopts = "-n 4"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: opt-in tests that hit real ML models or external APIs",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
